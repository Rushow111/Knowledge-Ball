name: Recheck Windows Validation Once

on:
  push:
    branches:
      - fix/windows-release-validation
    paths:
      - .github/workflows/recheck-windows-validation-once.yml

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-release-validation
      - name: Remove one-time recheck trigger
        shell: bash
        run: |
          rm .github/workflows/recheck-windows-validation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/recheck-windows-validation-once.yml
          git commit -m "CI: recheck transient mobile browser gate"
          git push origin HEAD:fix/windows-release-validation
