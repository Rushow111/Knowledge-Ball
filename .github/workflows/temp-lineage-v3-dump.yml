          rep('src/ui/app.ts',"import { GraphProjection, setCascadeDepthLimit } from '../projection/GraphProjection';", "import { GraphProjection, setCascadeDepthLimit } from '../projection/GraphProjection';\nimport { directConclusions, lineageMembers, stableLineageRole, topicIdFor } from '../domain/KnowledgeLineage';")
          rep('src/ui/app.ts',"import { editNode as cmdEditNode } from '../command/EditNode';\n",'')
          rep('src/ui/app.ts','      semanticKey: dn.semanticKey,\n      ...meta,', '      semanticKey: dn.semanticKey,\n      lineage: dn.lineage ? structuredClone(dn.lineage) : undefined,\n      ...meta,')
          rep('src/ui/app.ts','    reasoning: node.reasoning,\n  } : null;', '    reasoning: node.reasoning,\n    lineage: node.lineage,\n  } : null;')
          oldedit=Path('src/ui/app.ts').read_text()
