name: temp-lineage-v3-dump
on:
  push:
    branches: [feature/knowledge-lineage-v3]
permissions:
  contents: write
jobs:
  dump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/knowledge-lineage-v3
      - name: Stage complete feature draft
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if s.count(old) < count:
                  raise SystemExit(f'{path}: missing marker {old[:120]!r}')
              p.write_text(s.replace(old,new,count))

          Path('src/domain/KnowledgeLineage.ts').write_text(textwrap.dedent(r'''
            import type { GraphNode } from '../graph/Node';

            export type KnowledgeProposalKind = 'new' | 'optimization' | 'opposition';
            export type KnowledgeLineageRole = 'current' | 'history' | 'opposition' | 'candidate-history' | 'candidate-opposition' | 'rejected';
            export type KnowledgeViewMode = 'current' | 'personal' | 'lineage';
            export type RevalidationKind = 'challenge' | 'cascade';

            export interface KnowledgeLineageMeta {
              topicId: string;
              proposal: KnowledgeProposalKind;
              targetId?: string;
              role: KnowledgeLineageRole;
              rank: number;
              revalidation?: RevalidationKind;
            }

            export function topicIdFor(node: Pick<GraphNode,'id'|'lineage'>): string {
              return node.lineage?.topicId ?? node.id;
            }

            export function lineageRoleFor(node: Pick<GraphNode,'lineage'>): KnowledgeLineageRole {
              return node.lineage?.role ?? 'current';
            }

            export function lineageColorRole(node: Pick<GraphNode,'lineage'>): 'normal'|'history'|'opposition' {
              const role=lineageRoleFor(node);
              if(role==='history'||role==='candidate-history') return 'history';
              if(role==='opposition'||role==='candidate-opposition') return 'opposition';
              return 'normal';
            }

            export function stableLineageRole(node: Pick<GraphNode,'status'|'lineage'>): 'history'|'opposition'|null {
              if(node.status==='pending') return null;
              const role=lineageRoleFor(node);
              return role==='history'||role==='opposition'?role:null;
            }

            export function visibleInKnowledgeView(
              node: Pick<GraphNode,'status'|'mastery'|'lineage'>,
              mode: KnowledgeViewMode,
            ): boolean {
              const role=lineageRoleFor(node);
              if(role==='rejected') return false;
              // Pending proposals/revalidations must remain visible in every view.
              if(node.status==='pending') return true;
              if(role==='history'||role==='opposition') return mode==='lineage';
              return mode!=='personal'||node.mastery!=='none';
            }

            export function ensureCurrentLineage(node: GraphNode): KnowledgeLineageMeta {
              if(!node.lineage) node.lineage={topicId:node.id,proposal:'new',role:'current',rank:0};
              return node.lineage;
            }

            export function lineageMembers(nodes:readonly GraphNode[], nodeId:string) {
              const selected=nodes.find(n=>n.id===nodeId);
              if(!selected) return {history:[] as GraphNode[],opposition:[] as GraphNode[]};
              const topic=topicIdFor(selected);
              const ordered=(role:'history'|'opposition')=>nodes
                .filter(n=>n.id!==nodeId&&topicIdFor(n)===topic&&lineageRoleFor(n)===role&&!n.hidden)
                .sort((a,b)=>(a.lineage?.rank??1e9)-(b.lineage?.rank??1e9));
              return {history:ordered('history'),opposition:ordered('opposition')};
            }

            function setRole(node:GraphNode, topicId:string, role:KnowledgeLineageRole, rank:number):void {
              const base=ensureCurrentLineage(node);
              node.lineage={...base,topicId,role,rank,revalidation:undefined};
            }

            export function activateOptimization(nodes:GraphNode[], candidateId:string):string|null {
              const candidate=nodes.find(n=>n.id===candidateId);
              const target=candidate?.lineage?.targetId?nodes.find(n=>n.id===candidate.lineage!.targetId):undefined;
              if(!candidate||!target) return null;
              const topic=ensureCurrentLineage(target).topicId;
              for(const node of nodes){
                if(topicIdFor(node)===topic&&lineageRoleFor(node)==='history') setRole(node,topic,'history',(node.lineage?.rank??0)+1);
              }
              setRole(target,topic,'history',1);
              setRole(candidate,topic,'current',0);
              return target.id;
            }

            export function activateOpposition(nodes:GraphNode[], candidateId:string):string|null {
              const candidate=nodes.find(n=>n.id===candidateId);
              const target=candidate?.lineage?.targetId?nodes.find(n=>n.id===candidate.lineage!.targetId):undefined;
              if(!candidate||!target) return null;
              const topic=ensureCurrentLineage(target).topicId;
              const oldCurrentAndHistory=nodes.filter(n=>topicIdFor(n)===topic&&['current','history'].includes(lineageRoleFor(n))&&n.id!==candidate.id)
                .sort((a,b)=>lineageRoleFor(a)==='current'?-1:lineageRoleFor(b)==='current'?1:(a.lineage?.rank??0)-(b.lineage?.rank??0));
              const oldOpposition=nodes.filter(n=>topicIdFor(n)===topic&&lineageRoleFor(n)==='opposition'&&n.id!==candidate.id)
                .sort((a,b)=>(a.lineage?.rank??0)-(b.lineage?.rank??0));
              oldOpposition.forEach((n,i)=>setRole(n,topic,'history',i+1));
              oldCurrentAndHistory.forEach((n,i)=>setRole(n,topic,'opposition',i+1));
              setRole(candidate,topic,'current',0);
              return target.id;
            }

            export function reactivateLineageNode(nodes:GraphNode[], nodeId:string):string|null {
              const selected=nodes.find(n=>n.id===nodeId);
              if(!selected?.lineage) return null;
              const topic=selected.lineage.topicId;
              const role=lineageRoleFor(selected);
              const current=nodes.find(n=>topicIdFor(n)===topic&&lineageRoleFor(n)==='current');
              if(!current) return null;
              if(role==='history'){
                for(const node of nodes){
                  if(topicIdFor(node)===topic&&lineageRoleFor(node)==='history'&&node.id!==selected.id) setRole(node,topic,'history',(node.lineage?.rank??0)+1);
                }
                setRole(current,topic,'history',1);
                setRole(selected,topic,'current',0);
                return current.id;
              }
              if(role==='opposition'){
                // Existing red node wins the same side-swap that a new opposition candidate would.
                selected.lineage={...selected.lineage,targetId:current.id,role:'candidate-opposition'};
                return activateOpposition(nodes,selected.id);
              }
              return null;
            }

            export function directConclusions(nodes:readonly GraphNode[], nodeId:string):GraphNode[]{
              return nodes.filter(n=>!n.hidden&&n.premises.includes(nodeId));
            }

            export function downstreamClosure(nodes:readonly GraphNode[], roots:readonly string[]):string[]{
              const seen=new Set(roots); const queue=[...roots]; const result:string[]=[];
              while(queue.length){
                const current=queue.shift()!;
                for(const node of nodes){
                  if(seen.has(node.id)||!node.premises.includes(current)) continue;
                  seen.add(node.id); queue.push(node.id); result.push(node.id);
                }
              }
              return result;
            }

            export function rewirePremise(nodes:GraphNode[], oldId:string, newId:string):void{
              for(const node of nodes) node.premises=node.premises.map(id=>id===oldId?newId:id);
            }
          '''))

          # Domain node/event/protocol metadata.
          rep('src/graph/Node.ts',"import type { UserKnowledgeLayer } from '../domain/KnowledgeLayerPolicy';", "import type { UserKnowledgeLayer } from '../domain/KnowledgeLayerPolicy';\nimport type { KnowledgeLineageMeta } from '../domain/KnowledgeLineage';")
          rep('src/graph/Node.ts','  semanticKey?: string;\n}', '  semanticKey?: string;\n  lineage?: KnowledgeLineageMeta;\n}')

          rep('src/protocol/KnowledgeEditingProtocol.ts',"import type { NodeStatus, NodeType } from '../event/Event';", "import type { NodeStatus, NodeType } from '../event/Event';\nimport type { KnowledgeLineageMeta } from '../domain/KnowledgeLineage';")
          rep('src/protocol/KnowledgeEditingProtocol.ts','  semanticKey?: string;\n}', '  semanticKey?: string;\n  lineage?: KnowledgeLineageMeta;\n}',1)
          rep('src/protocol/KnowledgeEditingProtocol.ts','  logicRuleId?: string;\n}', '  logicRuleId?: string;\n  premises?: string[];\n  lineage?: KnowledgeLineageMeta;\n}',1)
          rep('src/protocol/KnowledgeEditingProtocol.ts','function validateDraftBatch(nodes: ProtocolNode[], drafts: NewProtocolNode[]): string[] {', 'function validateDraftBatch(nodes: ProtocolNode[], drafts: NewProtocolNode[], sameTitleTargetId?: string): string[] {')
          rep('src/protocol/KnowledgeEditingProtocol.ts',"    else if (usedTitles.has(title)) {\n      errors.push(`节点标题与现有或本次操作中的节点重复: ${draft.title.trim()}`);\n    } else {", "    else if (usedTitles.has(title)) {\n      const target=sameTitleTargetId?byId.get(sameTitleTargetId):undefined;\n      const allowed=Boolean(target&&canonicalKnowledgeText(target.title)===title&&draft.lineage?.proposal==='optimization'&&draft.lineage.targetId===target.id);\n      if(!allowed) errors.push(`节点标题与现有或本次操作中的节点重复: ${draft.title.trim()}`);\n    } else {")
          rep('src/protocol/KnowledgeEditingProtocol.ts','    logicRuleId: draft.logicRuleId,\n  };', '    logicRuleId: draft.logicRuleId,\n    lineage: draft.lineage ? structuredClone(draft.lineage) : undefined,\n  };')
          rep('src/protocol/KnowledgeEditingProtocol.ts','      errors.push(...validateDraftBatch(nodes, [edit.node]));', "      errors.push(...validateDraftBatch(nodes,[edit.node],edit.node.lineage?.proposal==='optimization'?edit.node.lineage.targetId:undefined));\n      for(const premiseId of edit.node.premises??[]){\n        const premise=byId.get(premiseId);\n        if(!premise) errors.push(`前提不存在: ${premiseId}`);\n        else if(!active(premise)) errors.push(`前提当前不可用: ${premiseId}`);\n      }")
          rep('src/protocol/KnowledgeEditingProtocol.ts','      append(nodeFromDraft(edit.node, []));', '      append(nodeFromDraft(edit.node, edit.node.premises ?? []));')

          rep('src/command/KnowledgeEdit.ts','    semanticKey: node.semanticKey,\n  }));', '    semanticKey: node.semanticKey,\n    lineage: node.lineage ? structuredClone(node.lineage) : undefined,\n  }));')

          # Server-authored revalidation-start event.
          rep('src/event/Event.ts',"export type KnowledgeVerdictFinalizedEvent = EventEnvelope<'KnowledgeVerdictFinalized', {", "export type KnowledgeRevalidationStartedEvent = EventEnvelope<'KnowledgeRevalidationStarted', {\n  roundId:string; nodeId:string; kind:'challenge'|'cascade'; stage:number; stake:string; policyVersion:KnowledgeVerdictPolicyVersion;\n}>;\nexport type KnowledgeVerdictFinalizedEvent = EventEnvelope<'KnowledgeVerdictFinalized', {")
          rep('src/event/Event.ts','KnowledgeStatusChangedEvent | KnowledgeNodeEditedEvent | KnowledgeVerdictFinalizedEvent;', 'KnowledgeStatusChangedEvent | KnowledgeNodeEditedEvent | KnowledgeRevalidationStartedEvent | KnowledgeVerdictFinalizedEvent;',1)
          rep('src/event/Event.ts','| KnowledgeStatusChangedEvent | KnowledgeNodeEditedEvent | KnowledgeVerdictFinalizedEvent;', '| KnowledgeStatusChangedEvent | KnowledgeNodeEditedEvent | KnowledgeRevalidationStartedEvent | KnowledgeVerdictFinalizedEvent;',1)

          # Projection: lineage transitions and directional cascade.
          rep('src/projection/GraphProjection.ts',"import { cascadeReachable } from '../graph/Graph';", "import { cascadeReachable } from '../graph/Graph';\nimport { activateOptimization, activateOpposition, downstreamClosure, reactivateLineageNode, rewirePremise } from '../domain/KnowledgeLineage';")
          rep('src/projection/GraphProjection.ts','          logicRuleId: draft.logicRuleId,\n        };', '          logicRuleId: draft.logicRuleId,\n          lineage: draft.lineage ? structuredClone(draft.lineage) : undefined,\n        };')
          rep('src/projection/GraphProjection.ts',"      if (edit.mode === 'atomic') append(edit.node, []);", "      if (edit.mode === 'atomic') append(edit.node, edit.node.premises ?? []);")
          rep('src/projection/GraphProjection.ts','      semanticKey: node.semanticKey,\n    }));', '      semanticKey: node.semanticKey,\n      lineage: node.lineage ? structuredClone(node.lineage) : undefined,\n    }));')
          old="""      case 'KnowledgeVerdictFinalized': {
        const n = this.state.nodesById[event.payload.nodeId];
        if (!n) break;
        if (event.payload.verdict === 'CORRECT') {
          n.status = 'verified';
          n.hidden = false;
        } else {
          n.status = 'falsified';
          n.hidden = true;
        }
        break;
      }"""
          new="""      case 'KnowledgeRevalidationStarted': {
        const n=this.state.nodesById[event.payload.nodeId];
        if(!n) break;
        n.status='pending'; n.hidden=false;
        n.lineage={...(n.lineage??{topicId:n.id,proposal:'new',role:'current',rank:0}),revalidation:event.payload.kind};
        break;
      }
      case 'KnowledgeVerdictFinalized': {
        const n=this.state.nodesById[event.payload.nodeId];
        if(!n) break;
        const nodes=nodeList(this.state);
        const revalidation=n.lineage?.revalidation;
        if(event.payload.verdict==='CORRECT'){
          n.status='verified'; n.hidden=false;
          let previous:string|null=null;
          if(revalidation==='challenge') previous=reactivateLineageNode(nodes,n.id);
          else if(n.lineage?.role==='candidate-history') previous=activateOptimization(nodes,n.id);
          else if(n.lineage?.role==='candidate-opposition') previous=activateOpposition(nodes,n.id);
          if(previous){
            rewirePremise(nodes,previous,n.id);
            for(const id of downstreamClosure(nodes,[n.id])){
              const dependent=this.state.nodesById[id];
              if(!dependent||dependent.id===n.id||dependent.status==='falsified') continue;
              dependent.status='pending'; dependent.hidden=false;
              dependent.lineage={...(dependent.lineage??{topicId:dependent.id,proposal:'new',role:'current',rank:0}),revalidation:'cascade'};
            }
          }
          if(n.lineage) n.lineage.revalidation=undefined;
        } else if(revalidation==='challenge'||revalidation==='cascade'){
          // A failed revalidation leaves the previously-active lineage role intact.
          n.status='verified'; n.hidden=false;
          if(n.lineage) n.lineage.revalidation=undefined;
        } else {
          n.status='falsified'; n.hidden=true;
          if(n.lineage) n.lineage.role='rejected';
        }
        break;
      }"""
          rep('src/projection/GraphProjection.ts',old,new)

          # Auth client can start exact V1 second verification and cascade rounds.
          rep('src/auth/AuthClient.ts','  async settleExpiredPendingKnowledgeVotes(maxRounds = 50): Promise<number> {', "  async startSecondKnowledgeVerification(nodeId:string):Promise<PendingKnowledgeVoteSnapshot>{\n    const current=await this.publicSession();\n    return parsePendingKnowledgeVote(await this.restRequest('/rest/v1/rpc/start_second_knowledge_verification',current,{method:'POST',body:JSON.stringify({target_node_id:nodeId,operation_key:`second-verification:${nodeId}`})}),nodeId);\n  }\n\n  async ensureCascadeKnowledgeVerification(nodeId:string,sourceNodeId:string):Promise<PendingKnowledgeVoteSnapshot>{\n    const current=await this.publicSession();\n    return parsePendingKnowledgeVote(await this.restRequest('/rest/v1/rpc/start_cascade_knowledge_verification',current,{method:'POST',body:JSON.stringify({target_node_id:nodeId,source_node_id:sourceNodeId})}),nodeId);\n  }\n\n  async settleExpiredPendingKnowledgeVotes(maxRounds = 50): Promise<number> {")

