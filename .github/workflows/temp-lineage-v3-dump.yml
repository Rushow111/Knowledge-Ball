          rep('src/ui/config/KnowledgeUiConfig.ts',"  falsified:KNOWLEDGE_SCENE_THEME.node.falsified,\n} as const;", "  falsified:KNOWLEDGE_SCENE_THEME.node.falsified,\n  history:0x7B8497,\n  opposition:0xE35D68,\n} as const;")
          rep('src/ui/scene/KnowledgeScene.ts',"import { isSystemCoreNodeId } from '../../domain/KnowledgeLayerPolicy';", "import { isSystemCoreNodeId } from '../../domain/KnowledgeLayerPolicy';\nimport { lineageColorRole, visibleInKnowledgeView, type KnowledgeLineageMeta, type KnowledgeViewMode } from '../../domain/KnowledgeLineage';")
          rep('src/ui/scene/KnowledgeScene.ts','  layer?: KnowledgeLayer;\n}', '  layer?: KnowledgeLayer;\n  lineage?: KnowledgeLineageMeta;\n}')
          rep('src/ui/scene/KnowledgeScene.ts','  setHideUntouched: (enabled: boolean) => void;', '  setHideUntouched: (enabled: boolean) => void;\n  setKnowledgeViewMode: (mode: KnowledgeViewMode) => void;')
          rep('src/ui/scene/KnowledgeScene.ts',"export function colorForNode(node: Pick<KnowledgeSceneNode, 'id' | 'status' | 'type' | 'effectiveLayer'>): number {\n  if (node.status === 'falsified')", "export function colorForNode(node: Pick<KnowledgeSceneNode, 'id' | 'status' | 'type' | 'effectiveLayer' | 'lineage'>): number {\n  const role=lineageColorRole(node as KnowledgeSceneNode);\n  if(role==='history') return NODE_SPECIAL_COLOR.history;\n  if(role==='opposition') return NODE_SPECIAL_COLOR.opposition;\n  if (node.status === 'falsified')")
          rep('src/ui/scene/KnowledgeScene.ts','  let hideUntouched = false;', "  let hideUntouched = false;\n  let knowledgeViewMode:KnowledgeViewMode='current';")
          # Replace live visibility expression only; retain legacy exported helper.
          rep('src/ui/scene/KnowledgeScene.ts','&& nodeVisibleInPersonalMode(node, hideUntouched)', "&& visibleInKnowledgeView(node as any,knowledgeViewMode)")
