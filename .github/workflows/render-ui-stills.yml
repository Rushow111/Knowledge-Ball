name: Render Knowledge Ball UI Stills

on:
  push:
    branches:
      - promo/remotion-ui-stills
    paths:
      - 'promo/remotion/**'
      - '.github/workflows/render-ui-stills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-ui-stills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated UI branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Remotion dependencies
        working-directory: promo/remotion
        run: npm install --no-audit --no-fund

      - name: Render UI stills from original Remotion visual system
        working-directory: promo/remotion
        run: |
          mkdir -p out/ui-stills
          npx remotion still src/index.ts KnowledgeBallUIExplore out/ui-stills/01-explore.png
          npx remotion still src/index.ts KnowledgeBallUINode out/ui-stills/02-node-details.png
          npx remotion still src/index.ts KnowledgeBallUICreate out/ui-stills/03-create-node.png
          npx remotion still src/index.ts KnowledgeBallUIVote out/ui-stills/04-vote-validation.png
          npx remotion still src/index.ts KnowledgeBallUILogin out/ui-stills/05-login-gate.png

      - name: Upload UI stills
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-ball-remotion-ui-stills
          path: promo/remotion/out/ui-stills/*.png
          if-no-files-found: error
          retention-days: 7
