name: Validate

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  stage-lineage-draft:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/knowledge-lineage-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/knowledge-lineage-v3
          fetch-depth: 0
      - name: Apply complete draft exactly once
        shell: python
        run: |
          from pathlib import Path
          marker = Path('src/domain/KnowledgeLineage.ts')
          if marker.exists():
              print('draft already staged')
              raise SystemExit(0)
          text = Path('.github/workflows/temp-lineage-v3-dump.yml').read_text()
          start = text.index('      - name: Stage complete feature draft')
          start = text.index('        run: |', start) + len('        run: |\n')
          end = text.index('      - name: Commit complete draft', start)
          lines = text[start:end].splitlines()
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          source = source.replace("rep('src/projection/GraphProjection.ts',old,new)", "p=Path('src/projection/GraphProjection.ts'); s=p.read_text(); a=s.index(\"      case 'KnowledgeVerdictFinalized': {\"); b=s.index(\"      case 'KnowledgeNodeEdited':\",a); p.write_text(s[:a]+new+'\\n'+s[b:])")
          old_form = "      const layer = isUserKnowledgeLayer(this.fType.value) ? this.fType.value : null;\n      if (!layer) {\n        this.showToast('请选择知识层级');\n        return;\n      }"
          current_form = "      const layerValue = this.fType.value;\n      if (!isUserKnowledgeLayer(layerValue)) {\n        this.showToast('请选择三个知识层级之一。');\n        return;\n      }\n      const layer = layerValue;"
          source = source.replace(old_form, current_form)
          exec(compile(source, 'lineage-v3-stage.py', 'exec'), {})
      - name: Commit complete draft
        run: |
          if [ ! -f src/domain/KnowledgeLineage.ts ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src supabase/migrations docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Draft knowledge lineage V3 end-to-end"
          git push origin HEAD:feature/knowledge-lineage-v3

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:pages
      - run: npm test
      - run: npm run test:download
      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Verify cloud-only public state with two already-open real pages
        run: npm run test:browser-cloud
      - run: npm run test:browser-mobile
      - name: Upload mobile scene visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-scene-visual
          path: artifacts/mobile-scene-*.png
          if-no-files-found: warn
      - name: Run Issue 51 production-scale interaction trace
        run: npm run test:issue51-browser
      - name: Upload Issue 51 Playwright trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue51-playwright-trace
          path: artifacts/issue51-trace.zip
          if-no-files-found: warn
      - name: Verify pull request merges cleanly with its base
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          npm run test:merge -- "origin/${{ github.base_ref }}"

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Run Android tests and build debug APK
        working-directory: android
        run: ./gradlew test assembleDebug

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ios:sync
      - name: Build iOS simulator app without signing
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
