name: Render Knowledge Ball Promo

on:
  push:
    branches:
      - promo/remotion-preview
    paths:
      - 'promo/remotion/**'
      - '.github/workflows/render-promo.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'promo/remotion/**'
      - '.github/workflows/render-promo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated promo branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Remotion dependencies
        working-directory: promo/remotion
        run: npm install --no-audit --no-fund

      - name: Render MP4
        working-directory: promo/remotion
        run: npm run render

      - name: Upload rendered promo
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-ball-promo
          path: promo/remotion/out/knowledge-ball-promo.mp4
          if-no-files-found: error
          retention-days: 7
